[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cadet"
version = "0.1.0-alpha.1"
description = "MCP server for delegating execution work from Claude Code to pluggable CLI coding agents"
readme = "README.md"
authors = [{ name = "Balint Zoltan Marton" }]
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30"
]

[project.urls]
Homepage = "https://github.com/zbalint/CADET"

[project.scripts]
cadet-server = "cadet.__main__:main"
cadet-install-agy-permissions = "cadet.process.agy_permissions:main"
cadet-wait-for-job = "cadet.process.wait_for_job:main"
cadet-setup-agy-docker = "cadet.process.agy_docker_setup:main"
cadet-setup-codex-docker = "cadet.process.codex_docker_setup:main"
cadet-setup-cursor-docker = "cadet.process.cursor_docker_setup:main"
cadet-setup-copilot-docker = "cadet.process.copilot_docker_setup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*"]
